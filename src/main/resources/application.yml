
spring:
  application:
    name: library-management

  datasource:
    url: jdbc:postgresql://localhost:5432/library_db
    username: ${DB_USERNAME:library_user}
    password: ${DB_PASSWORD:library_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

server:
  port: 8080
